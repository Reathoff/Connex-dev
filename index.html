<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connex — chargement</title><style>body{background:#211408;color:#f7d797;font:18px sans-serif;text-align:center;padding:12vh 1em}button{padding:.8em;font-size:1em}</style></head><body><p id="msg">Chargement de Connex et de ses cinématiques…</p><script>
async function start(){try{
if(!('DecompressionStream' in window))throw Error('Ce navigateur ne prend pas en charge la décompression. Utilise un navigateur récent.');
const urls=["scenario-test-815e694f19ef/jeu-00.txt", "scenario-test-815e694f19ef/jeu-01.txt", "scenario-test-815e694f19ef/jeu-02.txt", "scenario-test-815e694f19ef/jeu-03.txt", "scenario-test-815e694f19ef/jeu-04.txt"], video="https://raw.githubusercontent.com/Reathoff/Connex-dev/a83a932c4223f3095347f7de94a5563c8819b966/index.html";
const responses=await Promise.all([...urls.map(u=>fetch(u)),fetch(video)]);if(responses.some(r=>!r.ok))throw Error('Les fichiers du jeu ou les vidéos sont inaccessibles.');
const chunks=await Promise.all(responses.slice(0,-1).map(r=>r.text())); const encoded=chunks.join('');const binary=atob(encoded);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const sum=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)))).map(x=>x.toString(16).padStart(2,'0')).join('');if(sum!=="815e694f19eff4136c090fd5a9afdd22fe84ec72ee98c96f83417d4475d76fc1")throw Error('Le téléchargement du jeu est incomplet.');
const source=await responses[responses.length-1].text();for(const name of ['INTRO64','SCR64']){const m=source.match(new RegExp('const '+name+'="([A-Za-z0-9+/=]+)";'));if(!m)throw Error('Les cinématiques ne sont pas disponibles.');const token='__CONNEX_'+name+'_PLACEHOLDER__';if(!html.includes(token))throw Error('Fichier de jeu incorrect.');html=html.replace(token,m[1]);}
document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').textContent='Impossible de charger Connex : '+e.message;const b=document.createElement('button');b.textContent='Réessayer';b.onclick=()=>location.reload();document.body.appendChild(b);}}
start();</script></body></html>
